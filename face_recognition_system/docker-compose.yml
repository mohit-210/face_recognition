version: "3.9"

services:
  api:
    build: .
    container_name: face_recognition_api
    command: bash -lc "PYTHONPATH=/app alembic -c alembic.ini upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000 --workers 1"
    volumes:
      - .:/app
      - insightface_cache:/root/.insightface
      - deepface_cache:/root/.deepface
    working_dir: /app
    ports:
      - "8000:8000"
    # GPU enablement (Docker Desktop + NVIDIA drivers required)
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    depends_on:
      - postgres
    environment:
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=compute,utility
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_NAME=face_db
      - DB_USER=face_user
      - DB_PASSWORD=face_pass
      - JWT_SECRET_KEY=super-secret-change
      - JWT_REFRESH_SECRET_KEY=super-refresh-change
      - RECOGNITION_THRESHOLD=0.45
      - LIVENESS_THRESHOLD=0.77
      - ATTENDANCE_LIVENESS_THRESHOLD=0.77
      - FALLBACK_LIVENESS_THRESHOLD=0.50
      - ARCFACE_MODEL_NAME=buffalo_l
      - ARCFACE_DET_SIZE=640
      - RETINAFACE_MIN_SCORE=0.70
      - PASSIVE_ANTISPOOF_BACKEND=auto
      - PASSIVE_ANTISPOOF_ONNX_PATH=./models/vit_antispoof.onnx
      - PASSIVE_ANTISPOOF_ONNX_INPUT_SIZE=224
      - PASSIVE_ANTISPOOF_ONNX_LIVE_INDEX=1
      - PASSIVE_ANTISPOOF_CALIBRATION_PATH=./models/vit_antispoof_calibration.json
      - SESSION_SECRET_KEY=change-admin-session-secret
      - OMP_NUM_THREADS=2
      - OPENBLAS_NUM_THREADS=2
      - MKL_NUM_THREADS=2
      - NUMEXPR_NUM_THREADS=2
      - INSIGHTFACE_HOME=/root/.insightface
      - DEEPFACE_HOME=/root/.deepface

  postgres:
    image: postgres:16
    container_name: face_recognition_postgres
    restart: always
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: face_db
      POSTGRES_USER: face_user
      POSTGRES_PASSWORD: face_pass
    volumes:
      - pg_data:/var/lib/postgresql/data

volumes:
  pg_data:
  insightface_cache:
  deepface_cache:
