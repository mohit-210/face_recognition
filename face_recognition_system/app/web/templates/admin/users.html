{% extends "admin/base.html" %}
{% block content %}
<section class="dashboard-shell">
  {% include "admin/sidebar.html" %}
  <section class="module-board">
    <article class="card module-card">
      <h2>User Management</h2>
      <form method="post" action="/admin/users/create" class="row-form">
        <input type="text" name="name" placeholder="Full name" required />
        <input type="text" name="employee_code" placeholder="Employee code" required />
        <input type="password" name="password" placeholder="Password" required />
        <button type="submit">Create User</button>
      </form>
    </article>

    <article class="card module-card">
      <h2>Users</h2>
      <table>
        <thead>
          <tr>
            <th>ID</th>
            <th>Name</th>
            <th>Employee Code</th>
            <th>Status</th>
            <th>Actions</th>
          </tr>
        </thead>
        <tbody>
          {% for u in users %}
          <tr>
            <td>{{ u.id }}</td>
            <td>{{ u.name }}</td>
            <td>{{ u.employee_code }}</td>
            <td>{{ u.status }}</td>
            <td>
              <form method="post" action="/admin/users/{{ u.id }}/update" class="inline-form">
                <input type="text" name="name" value="{{ u.name }}" required />
                <select name="status">
                  <option value="active" {% if u.status == 'active' %}selected{% endif %}>active</option>
                  <option value="inactive" {% if u.status == 'inactive' %}selected{% endif %}>inactive</option>
                </select>
                <input type="password" name="password" placeholder="new password" />
                <button type="submit">Save</button>
              </form>
              <form method="post" action="/admin/users/{{ u.id }}/toggle" class="inline-form">
                <button type="submit">Toggle</button>
              </form>
              <form method="post" action="/admin/users/{{ u.id }}/delete" class="inline-form">
                <button type="submit" class="danger">Delete</button>
              </form>
            </td>
          </tr>
          {% endfor %}
        </tbody>
      </table>
    </article>
  </section>
</section>
{% endblock %}
