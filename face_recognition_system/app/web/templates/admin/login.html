{% extends "admin/base.html" %}
{% block content %}
<section class="grid">
  <article class="card">
    <h2>Admin Login</h2>
    <form method="post" action="/admin/login" class="stack">
      <label>Company ID
        <input type="number" name="company_id" required />
      </label>
      <label>Employee Code
        <input type="text" name="employee_code" required />
      </label>
      <label>Password
        <input type="password" name="password" required />
      </label>
      <button type="submit">Login</button>
    </form>
  </article>

  <article class="card">
    <h2>Create Company (Pre-login)</h2>
    <form method="post" action="/admin/bootstrap/company" class="stack">
      <label>Company Name
        <input type="text" name="name" required />
      </label>
      <button type="submit">Create Company</button>
    </form>
  </article>

  <article class="card full">
    <h2>Create First User (Pre-login)</h2>
    <p>Use this once per company to bootstrap access.</p>
    <form method="post" action="/admin/bootstrap/user" class="row-form">
      <select name="company_id" required>
        {% for c in companies %}
        <option value="{{ c.id }}">{{ c.id }} - {{ c.name }}</option>
        {% endfor %}
      </select>
      <input type="text" name="name" placeholder="Full name" required />
      <input type="text" name="employee_code" placeholder="Employee code" required />
      <input type="password" name="password" placeholder="Password" required />
      <button type="submit">Create First User</button>
    </form>
  </article>
</section>
{% endblock %}
